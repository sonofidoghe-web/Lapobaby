<script type="text/plain" data-page="home"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lapo Baby | Start your living and earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --danfo:#FFC20E; --ink:#17140F; --pin:#D9622B; --sheet-h:170px; --top:calc(env(safe-area-inset-top,0px)); }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:"Avenir Next","Nunito Sans",system-ui,sans-serif; color:var(--ink); background:#F1EFEA; }
  a { color:inherit; text-decoration:none; }
  a:focus-visible, button:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }

  .map { position:fixed; inset:0; }
  #mapsvg { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* round white buttons like the reference */
  .round {
    position:absolute; z-index:20; width:40px; height:40px; border-radius:50%;
    background:#fff; display:grid; place-items:center;
    box-shadow:0 1px 5px rgba(0,0,0,.15);
  }
  .round svg { width:21px; height:21px; fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .dot { position:absolute; width:12px; height:12px; border-radius:50%; background:#F0343C; border:2px solid #fff; }

  .profile { left:8px; top:calc(var(--top) + 10px); width:40px; height:40px; }
  .profile .dot { top:-2px; right:-3px; }
  .profile svg { width:30px; height:30px; fill:#FFE23B; stroke:none; }

  .topright { position:absolute; z-index:20; right:10px; top:calc(var(--top) + 12px); display:flex; align-items:flex-start; gap:8px; }
  .topright .txt { text-align:right; }
  .city { font-size:19px; font-weight:800; line-height:1.1; }
  .weather { display:flex; align-items:center; justify-content:flex-end; gap:5px; font-size:14px; font-weight:600; margin-top:5px; min-height:18px; }
  .weather svg { width:17px; height:17px; fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; }
  .ringavatar { width:38px; height:38px; border-radius:50%; border:2.5px solid #3B9BF0; overflow:hidden; background:#fff; flex:none; }
  .ringavatar svg { width:100%; height:100%; display:block; }

  .chips {
    position:absolute; z-index:20; top:calc(var(--top) + 69px); left:0; right:0;
    display:flex; gap:8px; padding:0 8px; overflow-x:auto; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; height:28px; padding:0 14px; display:inline-flex; align-items:center; gap:6px;
    background:#fff; border:0; border-radius:999px; font:inherit; font-size:13px; font-weight:600; color:var(--ink);
    box-shadow:0 1px 4px rgba(0,0,0,.1); cursor:pointer;
  }
  .chip.memories { padding:0 18px 0 24px; }
  .chip svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }

  /* right side stack */
  .side { right:10px; width:40px; height:40px; }
  .side .dot { right:-2px; bottom:0; }
  .redperson { width:30px; height:30px; fill:#B3151B; stroke:none; }

  /* bottom-left row */
  .bl { bottom:calc(var(--sheet-h) + 10px); width:44px; height:44px; }
  .bl svg.face { width:100%; height:100%; stroke:none; fill:none; }
  .bl.avatar { overflow:hidden; }
  .addfriends {
    position:absolute; z-index:20; left:116px; bottom:calc(var(--sheet-h) + 10px);
    height:44px; padding:0 20px 0 14px; display:flex; align-items:center; gap:10px;
    background:#fff; border-radius:999px; font-size:16px; font-weight:600; box-shadow:0 1px 5px rgba(0,0,0,.15);
  }
  .addfriends svg { width:22px; height:22px; fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* places */
  .place { position:absolute; z-index:5; display:flex; align-items:center; gap:6px; transform:translateY(-50%); }
  .place.right { flex-direction:row-reverse; text-align:right; }
  .place.hide { display:none; }
  .pin { flex:none; width:16px; height:16px; border-radius:50%; background:var(--pin); display:grid; place-items:center; }
  .pin svg { width:9px; height:9px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .photo { flex:none; width:31px; height:31px; border-radius:50%; border:2px solid var(--pin); overflow:hidden; background:#fff; }
  .photo svg { width:100%; height:100%; display:block; }
  .name { width:78px; color:var(--pin); font-weight:600; font-size:12px; line-height:1.1; }
  .name small { display:block; font-weight:500; font-size:10.5px; }
  .place.wide .name { width:112px; }

  .me { position:absolute; z-index:6; width:64px; text-align:center; transform:translateX(-50%); }
  .me svg { width:64px; height:104px; display:block; }
  .me span {
    display:inline-block; margin-top:-2px; padding:2px 7px; background:#fff; border-radius:6px;
    font-weight:800; font-size:13px; box-shadow:0 1px 4px rgba(0,0,0,.18); white-space:nowrap;
  }
  .me span b { color:#2E9E5B; font-weight:600; font-size:11px; }

  /* join sheet */
  .sheet {
    position:fixed; z-index:30; left:0; right:0; bottom:0; background:#fff;
    border-radius:20px 20px 0 0; box-shadow:0 -4px 18px rgba(0,0,0,.12);
    padding:12px 16px max(12px, env(safe-area-inset-bottom,0px)); text-align:center;
  }
  .sheet-inner { max-width:340px; margin:0 auto; }
  .sheet h1 { font-family:"Bricolage Grotesque",Georgia,sans-serif; font-weight:800; font-size:18px; letter-spacing:-.02em; margin-bottom:1px; }
  .sheet p { font-size:12.5px; font-weight:600; color:#4A4538; margin-bottom:8px; }
  .btn {
    display:flex; align-items:center; justify-content:center; width:100%; height:36px;
    background:var(--danfo); color:var(--ink); border:1.5px solid var(--danfo); border-radius:999px;
    font:inherit; font-size:13.5px; font-weight:700;
  }
  .btn.outline { border-color:var(--ink); margin-top:6px; }

  @media (min-width:700px) {
    .sheet { left:50%; right:auto; width:380px; transform:translateX(-50%); }
  }
</style>
</head>
<body>

<div class="map" id="map">

  <div class="me" id="me" style="left:60%;top:43.5%">

      <path d="M20 14c-3 12-1 24 3 30h18c4-6 6-18 3-30z" fill="#2B1F1B"/>

      <path d="M22 13c0-8 4-12 10-12s10 4 10 12c-3-2-6-3-10-3s-7 1-10 3z" fill="#fff" stroke="#E2E2E2" stroke-width=".6"/>
      <circle cx="32" cy="1.5" r="2.5" fill="#fff" stroke="#E2E2E2" stroke-width=".6"/>
      <circle cx="28" cy="16" r="3" fill="none" stroke="#3A3A3A" stroke-width=".9"/>
      <circle cx="36" cy="16" r="3" fill="none" stroke="#3A3A3A" stroke-width=".9"/>
      <path d="M29 21c2 1.5 4 1.5 6 0" stroke="#9A4A3A" stroke-width="1" fill="none" stroke-linecap="round"/>
      <rect x="24" y="58" width="7" height="38" rx="3" fill="#fff" stroke="#D9D9D9" stroke-width=".8"/>
      <rect x="33" y="58" width="7" height="38" rx="3" fill="#fff" stroke="#D9D9D9" stroke-width=".8"/>
      <rect x="23" y="94" width="9" height="7" rx="3" fill="#2A2A33"/>

  <a class="round profile" href="login.html?mode=login" aria-label="Log in to your profile">

    <span class="dot"></span>

  <div class="topright">
    <div class="txt">
      <div class="city">Lagos</div>
      <div class="weather" id="weather" hidden>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>

  <div class="chips" role="group" aria-label="Filter places">

      <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>

<script>
(function () {
  /* ---------- map drawing ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("mapsvg");

  function smooth(pts, closed) {
    var n = pts.length, d = "";
    if (closed) {
      d = "M" + (pts[n-1][0]+pts[0][0])/2 + " " + (pts[n-1][1]+pts[0][1])/2;
      for (var i = 0; i < n; i++) {
        var p = pts[i], q = pts[(i+1)%n];
        d += " Q" + p[0] + " " + p[1] + " " + (p[0]+q[0])/2 + " " + (p[1]+q[1])/2;
      }
      return d + "Z";
    }
    d = "M" + pts[0][0] + " " + pts[0][1];
    for (var j = 1; j < n - 1; j++) {
      var a = pts[j], b = pts[j+1];
      d += " Q" + a[0] + " " + a[1] + " " + (a[0]+b[0])/2 + " " + (a[1]+b[1])/2;
    }
    return d + " L" + pts[n-1][0] + " " + pts[n-1][1];
  }
  function add(tag, attrs, parent) {
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(el);
    return el;
  }

  function draw() {
    var W = window.innerWidth, H = window.innerHeight, r = rng(11);
    svg.innerHTML = "";
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    function inWater(x, y) {
      return y > H * 0.76 || (x < W * 0.46 && y > H * 0.51 && y < H * 0.78);
    }

    add("rect", { width: W, height: H, fill: "#EFEDE8" });

    var greens = [
      [.10,.08,.24,.06,"#E3EFD9"],[.62,.05,.26,.05,"#E7F1DE"],[.90,.2,.14,.08,"#DCEBD2"],
      [.18,.28,.2,.06,"#E3EFD9"],[.72,.32,.2,.06,"#E7F1DE"],[.42,.4,.14,.05,"#E3EFD9"],
      [.90,.52,.16,.06,"#DCEBD2"],[.12,.43,.16,.04,"#E7F1DE"],[.62,.6,.2,.05,"#E3EFD9"],
      [.85,.7,.2,.05,"#E7F1DE"],[.55,.7,.22,.04,"#E3EFD9"],[.1,.2,.12,.05,"#E9F3E0"],
      [.5,.22,.14,.04,"#E9F3E0"],[.3,.66,.12,.03,"#E3EFD9"],[.3,.08,.2,.05,"#E7F1DE"]
    ];
    greens.forEach(function (g) {
      var pts = [], n = 10;
      for (var i = 0; i < n; i++) {
        var a = i / n * Math.PI * 2, k = .7 + r() * .55;
        pts.push([g[0]*W + Math.cos(a)*g[2]*W*k, g[1]*H + Math.sin(a)*g[3]*H*k*1.7]);
      }
      add("path", { d: smooth(pts, true), fill: g[4] });
    });

    /* lake on the left, like the reference */
    var lake = [[.38,.52],[.44,.56],[.45,.6],[.38,.62],[.3,.66],[.2,.7],[.08,.72],[-.05,.74],[-.05,.64],[.04,.61],[.12,.57],[.2,.54],[.3,.53]]
      .map(function (p) { return [p[0]*W, p[1]*H]; });
    add("path", { d: smooth(lake, true), fill: "#A9CFF5" });

    /* coast: pale marsh then ocean */
    var marsh = [];
    for (var m = 0; m <= 8; m++) marsh.push([W*m/8, H*(.74 + Math.sin(m*1.3)*.012)]);
    marsh.push([W, H*.8]); marsh.push([0, H*.8]);
    add("path", { d: smooth(marsh, true), fill: "#E6EFF6" });
    var oc = [];
    for (var o = 0; o <= 10; o++) oc.push([W*o/10, H*(.79 + Math.sin(o*1.7)*.016)]);
    add("path", { d: smooth(oc, false) + " L" + W + " " + H + " L0 " + H + "Z", fill: "#9FC9F3" });

    /* thin rivers */
    [[[W*.82,H*.78],[W*.88,H*.7],[W*.82,H*.66],[W*.9,H*.6]],
     [[W,H*.31],[W*.92,H*.38],[W*.82,H*.44],[W*.72,H*.5]],
     [[W*.56,H*.2],[W*.62,H*.28],[W*.58,H*.36]]].forEach(function (p) {
      add("path", { d: smooth(p, false), fill: "none", stroke: "#A5C9EE", "stroke-width": 1.1 });
    });

    /* buildings */
    var clusters = [
      [.45,.16,18],[.65,.14,10],[.3,.3,14],[.5,.36,14],[.45,.48,14],
      [.5,.58,12],[.72,.6,10],[.12,.5,10],[.82,.28,8],[.2,.18,10],[.4,.7,10]
    ];
    clusters.forEach(function (c) {
      for (var i = 0; i < c[2]; i++) {
        var x = c[0]*W + (r()-.5)*W*.2, y = c[1]*H + (r()-.5)*H*.06;
        if (inWater(x, y)) continue;
        var w = 5 + r()*8, h = 5 + r()*8, rot = (r() < .5 ? 0 : (r()-.5)*40);
        var g = add("g", { transform: "translate(" + x + " " + y + ") rotate(" + rot + ")" });
        add("rect", { x: 1.5, y: 1.5, width: w, height: h, fill: "#DEDAD0" }, g);
        add("rect", { width: w, height: h, fill: "#EAE7E0", stroke: "#D6D2C7", "stroke-width": .7 }, g);
      }
    });

    /* thin roads */
    function road(pts, casing, fill) {
      var d = smooth(pts.map(function (p) { return [p[0]*W, p[1]*H]; }), false);
      add("path", { d: d, fill: "none", stroke: "#D6D2C8", "stroke-width": casing, "stroke-linecap": "round" });
      add("path", { d: d, fill: "none", stroke: "#fff", "stroke-width": fill, "stroke-linecap": "round" });
    }
    road([[-.05,.52],[.2,.5],[.45,.51],[.7,.57],[1.05,.65]], 4, 2.4);
    road([[-.05,.12],[.15,.17],[.3,.2],[.55,.1],[1.05,.07]], 4, 2.4);
    road([[.27,-.05],[.26,.2],[.3,.4],[.24,.52]], 3, 1.6);
    road([[.8,-.05],[.77,.2],[.83,.4],[.8,.6]], 3, 1.6);
    road([[-.05,.36],[.18,.35],[.38,.38]], 2.6, 1.4);
    road([[.5,.3],[.7,.3],[1.05,.36]], 2.6, 1.4);
    road([[.5,.51],[.52,.65],[.6,.78]], 2.6, 1.4);

    /* grass tufts */
    for (var t = 0; t < 70; t++) {
      var tx = r()*W, ty = r()*H;
      if (inWater(tx, ty)) continue;
      add("path", { d: "M" + tx + " " + ty + "l-3 -5M" + tx + " " + ty + "l0 -6M" + tx + " " + ty + "l3 -5",
        stroke: "#CDE1C2", "stroke-width": 1.2, fill: "none", "stroke-linecap": "round" });
    }
    /* marsh dashes near the coast */
    for (var s = 0; s < 46; s++) {
      var sx = r()*W, sy = H*(.7 + r()*.1);
      add("path", { d: "M" + sx + " " + sy + "l5 0M" + (sx+2) + " " + (sy+3) + "l-2 -3M" + (sx+3) + " " + (sy+3) + "l2 -3",
        stroke: "#B6D3EE", "stroke-width": 1, fill: "none" });
    }
  }

  /* ---------- avatars ---------- */
  function face(o) {
    var hair = o.style === "long"
      ? '<path d="M14 40c-4-16 2-28 18-28s22 12 18 28l-4 6V34H18v12z" fill="' + o.hair + '"/>'
      : o.style === "cap"
      ? '<path d="M16 28c0-10 6-15 16-15s16 5 16 15z" fill="' + o.hair + '"/><rect x="14" y="27" width="36" height="4" rx="2" fill="' + o.hair + '"/>'
      : '<path d="M17 30c-1-12 6-17 15-17s16 5 15 17c-3-5-8-7-15-7s-12 2-15 7z" fill="' + o.hair + '"/>';
    return '<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="' + o.bg + '"/>' +
      (o.style === "long" ? hair : "") +
      '<path d="M8 64c2-12 10-17 24-17s22 5 24 17z" fill="' + o.shirt + '"/>' +
      '<rect x="28" y="40" width="8" height="9" fill="' + o.skin + '"/>' +
      '<ellipse cx="32" cy="30" rx="12" ry="14" fill="' + o.skin + '"/>' +
      (o.style === "long" ? "" : hair) +
      (o.shades
        ? '<rect x="19" y="26" width="12" height="7" rx="3" fill="#15110E"/><rect x="33" y="26" width="12" height="7" rx="3" fill="#15110E"/>'
        : '<circle cx="27" cy="31" r="1.6" fill="#2A1A12"/><circle cx="37" cy="31" r="1.6" fill="#2A1A12"/>') +
      '<path d="M27 38c2 2 8 2 10 0" stroke="#7A3B2E" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
  }
  function beanieFace() {
    return '<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#F6E9F0"/>' +
      '<path d="M14 64c0-14 7-20 18-20s18 6 18 20z" fill="#E7A6D8"/>' +
      '<path d="M16 22c-3 12 0 24 5 28h22c5-4 8-16 5-28z" fill="#2B1F1B"/>' +
      '<ellipse cx="32" cy="32" rx="12" ry="14" fill="#F0C9A0"/>' +

  const STATES = { Nigeria: "Abia,Adamawa,Akwa Ibom,Anambra,Bauchi,Bayelsa,Benue,Borno,Cross River,Delta,Ebonyi,Edo,Ekiti,Enugu,FCT Abuja,Gombe,Imo,Jigawa,Kaduna,Kano,Katsina,Kebbi,Kogi,Kwara,Lagos,Nasarawa,Niger,Ogun,Ondo,Osun,Oyo,Plateau,Rivers,Sokoto,Taraba,Yobe,Zamfara".split(","), USA: "Alabama,Alaska,Arizona,Arkansas,California,Colorado,Connecticut,Delaware,Florida,Georgia,Hawaii,Idaho,Illinois,Indiana,Iowa,Kansas,Kentucky,Louisiana,Maine,Maryland,Massachusetts,Michigan,Minnesota,Mississippi,Missouri,Montana,Nebraska,Nevada,New Hampshire,New Jersey,New Mexico,New York,North Carolina,North Dakota,Ohio,Oklahoma,Oregon,Pennsylvania,Rhode Island,South Carolina,South Dakota,Tennessee,Texas,Utah,Vermont,Virginia,Washington,West Virginia,Wisconsin,Wyoming".split(",") };
  let currency = "NGN";
  $("su-country").addEventListener("change", () => {
    const list = STATES[$("su-country").value] || [], st = $("su-state");
    st.innerHTML = '<option value="">' + (list.length ? "Choose your state" : "Choose your country first") + "</option>" + list.map((x) => "<option>" + x + "</option>").join("");
    st.disabled = !list.length;
  });
  document.querySelectorAll("#cur .tab").forEach((b) => b.addEventListener("click", () => {
    currency = b.dataset.c;
    document.querySelectorAll("#cur .tab").forEach((x) => x.setAttribute("aria-selected", x === b));
  }));
  const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';
  document.querySelectorAll(".eye").forEach((b) => {
    b.innerHTML = EYE;
    b.addEventListener("click", () => {
      const input = $(b.dataset.target);
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      b.innerHTML = show ? EYE_OFF : EYE;
      b.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  });

  /* Usernames are stored as a private sign-in address. If the person gives no email,
     this address is used. It never receives mail. */
  const nameToEmail = (u) => u + "@users.lapobaby.invalid";

  const errors = {
    "auth/email-already-in-use": "That username or email is already taken.",
    "auth/invalid-email": "That email does not look right.",
    "auth/weak-password": "Use a password with at least 8 characters.",
    "auth/invalid-credential": "Username or password is incorrect.",
    "auth/user-not-found": "No account found with those details.",
    "auth/wrong-password": "Username or password is incorrect.",
    "auth/too-many-requests": "Too many attempts. Wait a moment and try again.",
    "auth/network-request-failed": "No connection. Check your internet and try again.",
    "auth/operation-not-allowed": "Email and password sign-in is not turned on in Firebase yet."
  };
  const say = (el, text, type) => { el.textContent = text; el.className = "msg " + (type || ""); };

  /* tabs */
  function setTab(which) {
    const signup = which === "signup";
    $("signupForm").hidden = !signup;
    $("loginForm").hidden = signup;
    $("tab-signup").setAttribute("aria-selected", signup);
    $("tab-login").setAttribute("aria-selected", !signup);
    
  }
  $("tab-signup").addEventListener("click", () => setTab("signup"));
  $("tab-login").addEventListener("click", () => setTab("login"));
  setTab(new URLSearchParams(window.__Q).get("mode") === "login" ? "login" : "signup");

  /* sign up */
  $("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("su-msg");
    const name = $("su-name").value.trim();
    const user = $("su-user").value.trim().toLowerCase().replace(/^@/, "");
    const pass = $("su-pass").value;
    const email = $("su-email").value.trim();
    if (!name) return say(msg, "Enter your name.", "error");
    if (!/^[a-z0-9_]{3,20}$/.test(user)) return say(msg, "Username: 3 to 20 letters, numbers or underscores.", "error");
    if (pass.length < 8) return say(msg, "Password must be at least 8 characters.", "error");
    if (pass === "12345678" || pass === "123456") return say(msg, "Pick a stronger password.", "error");
    if (!$("su-country").value) return say(msg, "Choose your country.", "error");
    if (!$("su-state").value) return say(msg, "Choose your state.", "error");

      const cred = await createUserWithEmailAndPassword(auth, email || nameToEmail(user), pass);
      await updateProfile(cred.user, { displayName: name });
      say(msg, "Account created. Welcome to Lagos, @" + user + ".", "ok");
      sessionStorage.setItem("lb_username", user);
      sessionStorage.setItem("lb_profile", JSON.stringify({ country: $("su-country").value, state: $("su-state").value, currency }));
      go("avatar.html");
    } catch (err) {
      say(msg, errors[err.code] || "Something went wrong. Try again.", "error");
    } finally { $("su-submit").disabled = false; }
  });

  /* log in */
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("li-msg");
    const id = $("li-id").value.trim().toLowerCase().replace(/^@/, "");
    const pass = $("li-pass").value;
    if (!id) return say(msg, "Enter your username or email.", "error");
    if (!pass) return say(msg, "Enter your password.", "error");
    $("li-submit").disabled = true; say(msg, "");

      go("city.html");
    } catch (err) {
      say(msg, errors[err.code] || "Something went wrong. Try again.", "error");
    } finally { $("li-submit").disabled = false; }
  });

  /* forgot password */
  $("forgot").addEventListener("click", async () => {
    const msg = $("li-msg");
    const id = $("li-id").value.trim();
    if (!id.includes("@")) return say(msg, "Type the email you signed up with above, then tap Forgot password.", "error");
    try {
      await sendPasswordResetEmail(auth, id);
      say(msg, "Reset email sent. Check your inbox.", "ok");
    } catch (err) {
      say(msg, errors[err.code] || "Could not send the reset email.", "error");
    }
  });
<\/script>
</body>
</html>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  });
  const auth = getAuth(app), db = getFirestore(app);
// Draws the Lapo Baby character as SVG. Used by the creator and the city.
const DEFAULT = {
  body: "man", skin: "#8D5A3B", hairStyle: "short", hairColor: "#1B1210", beard: "none",
  topStyle: "long", top: "#FFFFFF", bottomStyle: "pants", bottom: "#4D6A96",
  shoes: "#E8E8EC", hat: "none"
};

function avatarSVG(cfg) {
  const c = Object.assign({}, DEFAULT, cfg || {});
  const w = c.body === "woman";
  const tx = w ? 33 : 30, tw = w ? 34 : 40;
  let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200">';

  // hair behind the head
  if (c.hairStyle === "afro") s += `<circle cx="50" cy="24" r="25" fill="${c.hairColor}"/>`;
  if (c.hairStyle === "long") s += `<path d="M32 36q-4-27 18-27t18 27l3 44h-11V50H40v30H29z" fill="${c.hairColor}"/>`;

  // legs and shoes

    s += `<path d="M${tx - 1} 112h${tw + 2}l8 40H${tx - 9}z" fill="${c.bottom}"/>`;
  } else {
    s += `<rect x="36" y="110" width="13" height="80" rx="5" fill="${c.bottom}"/><rect x="51" y="110" width="13" height="80" rx="5" fill="${c.bottom}"/>`;
    s += `<rect x="${tx}" y="104" width="${tw}" height="16" fill="${c.bottom}"/>`;
  }

  // arms
  if (c.topStyle === "long") {
    s += `<rect x="${tx - 11}" y="64" width="11" height="50" rx="5" fill="${c.top}"/><rect x="${tx + tw}" y="64" width="11" height="50" rx="5" fill="${c.top}"/>`;
  } else {
    s += `<rect x="${tx - 9}" y="66" width="9" height="46" rx="4" fill="${c.skin}"/><rect x="${tx + tw}" y="66" width="9" height="46" rx="4" fill="${c.skin}"/>`;
    s += `<rect x="${tx - 11}" y="64" width="11" height="20" rx="5" fill="${c.top}"/><rect x="${tx + tw}" y="64" width="11" height="20" rx="5" fill="${c.top}"/>`;
  }
  s += `<circle cx="${tx - 5}" cy="117" r="5.5" fill="${c.skin}"/><circle cx="${tx + tw + 5}" cy="117" r="5.5" fill="${c.skin}"/>`;

  // torso and neck
  s += `<path d="M${tx} 68q0-8 9-10h${tw - 18}q9 2 9 10v50H${tx}z" fill="${c.top}"/>`;
  s += `<rect x="45" y="50" width="10" height="12" fill="${c.skin}"/>`;

  // head
  s += `<circle cx="34" cy="38" r="4" fill="${c.skin}"/><circle cx="66" cy="38" r="4" fill="${c.skin}"/>`;
  s += `<ellipse cx="50" cy="36" rx="16" ry="19" fill="${c.skin}"/>`;

  s += `<circle cx="43.6" cy="37" r="1.7" fill="#1B1210"/><circle cx="57.6" cy="37" r="1.7" fill="#1B1210"/>`;
  s += `<path d="M39 32q4-3 8 0M53 32q4-3 8 0" stroke="#1B1210" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if (w) s += `<path d="M39.5 35.5l-2-1.2M60.5 35.5l2-1.2" stroke="#1B1210" stroke-width="1.2" stroke-linecap="round"/>`;
  s += `<path d="M48 42q2 2 4 0" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
  s += `<path d="M45 47q5 3 10 0" stroke="#6B2F25" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;

  if (c.beard === "full") s += `<path d="M34 38q0 26 16 26t16-26q-3 14-16 14T34 38z" fill="${c.hairColor}"/><path d="M43 44q7-3 14 0q-7 2-14 0z" fill="${c.hairColor}"/>`;

  // hair on top
  if (c.hairStyle === "short" || c.hairStyle === "bun" || c.hairStyle === "long")
    s += `<path d="M34 34q0-21 16-21t16 21q-6-9-16-9t-16 9z" fill="${c.hairColor}"/>`;

  return s + "</svg>";
}


  const cats = [
    ["Body", "body", [["Man","man"],["Woman","woman"]]],
    ["Skin", "skin", ["#F2D1B3","#E0AC83","#C68642","#8D5A3B","#5C3A28","#3B2417"]],
    ["Hair", "hairStyle", [["None","none"],["Short","short"],["Afro","afro"],["Long","long"],["Bun","bun"]]],
    ["Hair color", "hairColor", ["#1B1210","#4A2C1B","#8A5A2B","#D8B46A","#B8B8B8","#C0392B"]],

    ["Hat", "hat", [["None","none"],["Beanie","beanie"],["Cap","cap"],["Fur hat","fur"]]]
  ];
  const cfg = Object.assign({}, DEFAULT);
  let active = 0, user = null;

  function drawStage() { $("stage").innerHTML = avatarSVG(cfg); }

      b.onclick = () => { active = i; drawTabs(); drawOpts(); };
      $("tabs").appendChild(b);

  function drawOpts() {
    const [, key, list] = cats[active];
    $("opts").innerHTML = "";
    list.forEach((o) => {
      const isColor = typeof o === "string";
      const val = isColor ? o : o[1];
      const b = document.createElement("button");
      b.className = isColor ? "sw" : "opt";
      if (isColor) { b.style.background = o; b.setAttribute("aria-label", o); } else b.textContent = o[0];
      b.setAttribute("aria-pressed", cfg[key] === val);
      b.onclick = () => { cfg[key] = val; drawStage(); drawOpts(); };
      $("opts").appendChild(b);

  onAuthStateChanged(auth, async (u) => {
    if (!u) { go("login.html?mode=login",true); return; }

    try {
      const snap = await getDoc(doc(db, "users", u.uid));
      if (snap.exists() && snap.data().avatar && !window.__Q.includes("edit")) go("city.html",true);
    } catch (e) { /* first visit, nothing saved yet */ }
  });

  $("go").onclick = async () => {
    if (!user) return;
    $("go").disabled = true; $("msg").textContent = "";
    const synthetic = (user.email || "").endsWith("@users.lapobaby.invalid");
    const username = sessionStorage.getItem("lb_username") || (synthetic ? user.email.split("@")[0] : "");
    try {
      await setDoc(doc(db, "users", user.uid), {
        name: user.displayName || "", username, avatar: cfg, followers: 0, currency: "NGN", ...JSON.parse(sessionStorage.getItem("lb_profile") || "{}"), createdAt: serverTimestamp()
      }, { merge: true });
      await setDoc(doc(db, "profiles", user.uid), { name: user.displayName || "", username, avatar: cfg });
      if (username) await setDoc(doc(db, "usernames", username), { uid: user.uid }).catch(() => {});
      go("city.html");
    } catch (e) {
      $("msg").textContent = "Could not save. Check that Firestore is turned on and the rules are set.";
      $("go").disabled = false;
    }
  };
<\/script>

  }

  if (c.hat === "fur") s += `<path d="M25 44q-4-34 25-34t25 34q-3-10-7-16-14-9-36 0-4 6-7 16z" fill="#7A5636"/><ellipse cx="29" cy="46" rx="6" ry="13" fill="#6A4A2E"/><ellipse cx="71" cy="46" rx="6" ry="13" fill="#6A4A2E"/>`;
  return s + "</svg>";
}
const faceSVG = (cfg) => avatarSVG(cfg).replace('viewBox="0 0 100 200"', 'viewBox="20 -6 60 60"');

/* ---- earning rates, in naira ---- */
const RATES = { follower: 0.001, view: 0.0001, like: 0.0001, comment: 0.0001, share: 0.0001 };
let ngnPerUsd = 1500;

const $ = (id) => document.getElementById(id);
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }

let user, me, posts = [], tab = "photos";
const isUsd = () => me.currency === "USD";
const conv = (ngn) => isUsd() ? ngn / ngnPerUsd : ngn;
const money = (ngn) => (isUsd() ? "$" : "\u20A6") + conv(ngn).toFixed(isUsd() ? 8 : 4);

function totals() {
  const t = { follower: me.followers || 0, view: 0, like: 0, comment: 0, share: 0 };
  posts.forEach((p) => { t.view += p.views || 0; t.like += p.likes || 0; t.comment += p.comments || 0; t.share += p.shares || 0; });
  return t;
}
function render() {
  const t = totals();
  let total = 0; for (const k in t) total += t[k] * RATES[k];
  $("bal").textContent = money(total);
  $("rate").textContent = isUsd() ? "$1 = \u20A6" + ngnPerUsd.toFixed(0) : "Paid in naira";
  $("cur").textContent = isUsd() ? "$" : "\u20A6";
  $("meta").textContent = (me.username ? "@" + me.username + " \u00B7 " : "") + t.follower + " follower" + (t.follower === 1 ? "" : "s");
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.t === tab));
  const c = $("content");
  if (tab === "earn") {
    const rows = [["Followers", t.follower, RATES.follower], ["Views", t.view, RATES.view], ["Likes", t.like, RATES.like], ["Comments", t.comment, RATES.comment], ["Shares", t.share, RATES.share]];
    c.innerHTML = '<table><thead><tr><th></th><th>Count</th><th>Each</th><th>Earned</th></tr></thead><tbody>' +
      rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${money(r[2])}</td><td>${money(r[1] * r[2])}</td></tr>`).join("") +
      `</tbody><tfoot><tr><td colspan="3">Total</td><td>${money(total)}</td></tr></tfoot></table>` +
      '<p class="note">You earn for every follower, view, like, comment and share on your posts.</p>';
    return;
  }
  const list = posts.filter((p) => tab === "photos" ? p.type === "image" : p.type === "video");
  c.innerHTML = '<div class="grid"></div>';
  const g = c.firstChild;
  if (!list.length) { g.innerHTML = '<p class="empty">Nothing here yet. Tap Upload to add your first ' + (tab === "photos" ? "photo" : "video") + '.</p>'; return; }
  list.forEach((p) => {
    const b = document.createElement("button"); b.className = "tile";
    b.innerHTML = p.type === "image" ? `<img src="${p.url}" alt="">` : `<video src="${p.url}#t=0.1" muted preload="metadata" playsinline></video><span class="pl"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>`;
    b.onclick = () => { $("vbox").innerHTML = p.type === "image" ? `<img src="${p.url}" alt="">` : `<video src="${p.url}" controls autoplay playsinline></video>`; $("viewer").hidden = false; };
    g.appendChild(b);
  });
}

async function loadPosts() {
  try {
    const s = await getDocs(query(collection(db, "users", user.uid, "posts"), orderBy("createdAt", "desc")));
    posts = s.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  } catch (e) { posts = []; }
  render();
}

onAuthStateChanged(auth, async (u) => {
  if (!u) { go("login.html?mode=login",true); return; }
  user = u;
  try { const s = await getDoc(doc(db, "users", u.uid)); if (s.exists()) me = s.data(); } catch (e) {}
  if (!me || !me.avatar) { go("avatar.html",true); return; }
  if (!me.currency) me.currency = "NGN";
  $("loading").remove();
  $("name").textContent = me.name || u.displayName || "You";
  $("face").insertAdjacentHTML("afterbegin", faceSVG(me.avatar));
  fetch("https://open.er-api.com/v6/latest/USD").then((r) => r.json()).then((j) => { if (j && j.rates && j.rates.NGN) { ngnPerUsd = j.rates.NGN; render(); } }).catch(() => {});
  render(); loadPosts();
});

/* ---- actions ---- */
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });
$("cur").onclick = async () => {
  me.currency = isUsd() ? "NGN" : "USD"; render();
  try { await updateDoc(doc(db, "users", user.uid), { currency: me.currency }); } catch (e) { toast("Could not save your currency"); }
};
$("upload").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  for (const f of e.target.files) {
    const type = f.type.startsWith("video") ? "video" : f.type.startsWith("image") ? "image" : null;
    if (!type) { toast("Only photos and videos"); continue; }
    if (f.size > 100 * 1024 * 1024) { toast("Max file size is 100 MB"); continue; }
    const path = "posts/" + user.uid + "/" + Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    try {
      const task = uploadBytesResumable(ref(storage, path), f);
      await new Promise((ok, no) => { task.on("state_changed", (s) => toast("Uploading " + Math.round(s.bytesTransferred / s.totalBytes * 100) + "%"), no, ok); });
      const url = await getDownloadURL(task.snapshot.ref);
      await addDoc(collection(db, "users", user.uid, "posts"), { type, url, path, views: 0, likes: 0, comments: 0, shares: 0, createdAt: serverTimestamp() });
      toast("Uploaded");
      tab = type === "image" ? "photos" : "videos";
    } catch (err) { toast("Upload failed. Check Firebase Storage is on and its rules are set."); }
  }
  e.target.value = ""; loadPosts();
};
$("closeV").onclick = () => { $("viewer").hidden = true; $("vbox").innerHTML = ""; };
$("more").onclick = () => { $("menu").hidden = !$("menu").hidden; };
$("logout").onclick = async () => { await signOut(auth); go("index.html",true); };
document.querySelectorAll("[data-soon]").forEach((b) => b.onclick = () => toast(b.dataset.soon + " is coming next"));
<\/script>
</body>
</html>
</script>

  #toast.show { opacity:1; }

<body>
<div class="bg"><svg viewBox="0 0 100 90" fill="none" stroke="#fff" stroke-width="1.4"><path id="h" d="M50 88C10 60 0 38 0 24C0 10 12 0 26 0C36 0 46 6 50 14C54 6 64 0 74 0C88 0 100 10 100 24C100 38 90 60 50 88Z"/><path transform="translate(12 10) scale(.76)" d="M50 88C10 60 0 38 0 24C0 10 12 0 26 0C36 0 46 6 50 14C54 6 64 0 74 0C88 0 100 10 100 24C100 38 90 60 50 88Z"/><path transform="translate(24 20) scale(.52)" d="M50 88C10 60 0 38 0 24C0 10 12 0 26 0C36 0 46 6 50 14C54 6 64 0 74 0C88 0 100 10 100 24C100 38 90 60 50 88Z"/></svg></div>

<section class="list" id="list">

    <button class="rc" id="sbtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>

<div class="modal" id="addm" hidden><div class="panel"><h2>Add a friend</h2><p>Type their username to start a chat.</p><input id="un_in" placeholder="@username" autocapitalize="none" autocomplete="off"><p class="err" id="err"></p><button class="pbtn" id="addgo">Start chat</button><button class="pbtn light" id="addx">Cancel</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyC42fUKbNURnKeZR5KLjrAk9StZSbaUB9g", authDomain: "repaid-edef4.firebaseapp.com", projectId: "repaid-edef4",
  storageBucket: "repaid-edef4.firebasestorage.app", messagingSenderId: "514373962526", appId: "1:514373962526:web:244c032e8b3b3b0002570f"
});
const auth = getAuth(app), db = getFirestore(app);
/* ---- avatar drawing (same as the creator and the city) ---- */
const DEFAULT = { body:"man", skin:"#8D5A3B", hairStyle:"short", hairColor:"#1B1210", beard:"none", topStyle:"long", top:"#FFFFFF", bottomStyle:"pants", bottom:"#4D6A96", shoes:"#E8E8EC", hat:"none" };
function avatarSVG(cfg) {
  const c = Object.assign({}, DEFAULT, cfg || {}), w = c.body === "woman", tx = w ? 33 : 30, tw = w ? 34 : 40;
  let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200">';
  if (c.hairStyle === "afro") s += `<circle cx="50" cy="24" r="25" fill="${c.hairColor}"/>`;
  if (c.hairStyle === "long") s += `<path d="M32 36q-4-27 18-27t18 27l3 44h-11V50H40v30H29z" fill="${c.hairColor}"/>`;
  s += `<ellipse cx="41" cy="192" rx="10" ry="5" fill="${c.shoes}"/><ellipse cx="59" cy="192" rx="10" ry="5" fill="${c.shoes}"/>`;
  if (c.bottomStyle === "skirt") { s += `<rect x="38" y="140" width="9" height="50" rx="4" fill="${c.skin}"/><rect x="53" y="140" width="9" height="50" rx="4" fill="${c.skin}"/><path d="M${tx-1} 112h${tw+2}l8 40H${tx-9}z" fill="${c.bottom}"/>`; }
  else { s += `<rect x="36" y="110" width="13" height="80" rx="5" fill="${c.bottom}"/><rect x="51" y="110" width="13" height="80" rx="5" fill="${c.bottom}"/><rect x="${tx}" y="104" width="${tw}" height="16" fill="${c.bottom}"/>`; }
  if (c.topStyle === "long") s += `<rect x="${tx-11}" y="64" width="11" height="50" rx="5" fill="${c.top}"/><rect x="${tx+tw}" y="64" width="11" height="50" rx="5" fill="${c.top}"/>`;
  else s += `<rect x="${tx-9}" y="66" width="9" height="46" rx="4" fill="${c.skin}"/><rect x="${tx+tw}" y="66" width="9" height="46" rx="4" fill="${c.skin}"/><rect x="${tx-11}" y="64" width="11" height="20" rx="5" fill="${c.top}"/><rect x="${tx+tw}" y="64" width="11" height="20" rx="5" fill="${c.top}"/>`;
  s += `<circle cx="${tx-5}" cy="117" r="5.5" fill="${c.skin}"/><circle cx="${tx+tw+5}" cy="117" r="5.5" fill="${c.skin}"/>`;
  s += `<path d="M${tx} 68q0-8 9-10h${tw-18}q9 2 9 10v50H${tx}z" fill="${c.top}"/><rect x="45" y="50" width="10" height="12" fill="${c.skin}"/>`;
  s += `<circle cx="34" cy="38" r="4" fill="${c.skin}"/><circle cx="66" cy="38" r="4" fill="${c.skin}"/><ellipse cx="50" cy="36" rx="16" ry="19" fill="${c.skin}"/>`;
  s += `<ellipse cx="43" cy="37" rx="3.4" ry="2.4" fill="#fff"/><ellipse cx="57" cy="37" rx="3.4" ry="2.4" fill="#fff"/><circle cx="43.6" cy="37" r="1.7" fill="#1B1210"/><circle cx="57.6" cy="37" r="1.7" fill="#1B1210"/>`;
  s += `<path d="M39 32q4-3 8 0M53 32q4-3 8 0" stroke="#1B1210" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if (w) s += `<path d="M39.5 35.5l-2-1.2M60.5 35.5l2-1.2" stroke="#1B1210" stroke-width="1.2" stroke-linecap="round"/>`;
  s += `<path d="M48 42q2 2 4 0" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M45 47q5 3 10 0" stroke="#6B2F25" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  if (c.beard === "goatee") s += `<path d="M43 44q7-3 14 0q-7 2-14 0z" fill="${c.hairColor}"/><path d="M44 49q6 10 12 0q-6 2-12 0z" fill="${c.hairColor}"/>`;
  if (c.beard === "full") s += `<path d="M34 38q0 26 16 26t16-26q-3 14-16 14T34 38z" fill="${c.hairColor}"/><path d="M43 44q7-3 14 0q-7 2-14 0z" fill="${c.hairColor}"/>`;
  if (["short","bun","long"].includes(c.hairStyle)) s += `<path d="M34 34q0-21 16-21t16 21q-6-9-16-9t-16 9z" fill="${c.hairColor}"/>`;
  if (c.hairStyle === "bun") s += `<circle cx="50" cy="9" r="7" fill="${c.hairColor}"/>`;
  if (c.hat === "beanie") s += `<path d="M33 31q0-21 17-21t17 21z" fill="#3B6FD6"/><rect x="32" y="28" width="36" height="7" rx="3" fill="#2F58AE"/>`;
  if (c.hat === "cap") s += `<path d="M34 31q0-19 16-19t16 19z" fill="#D9442B"/><path d="M32 31h34q9 0 12 5H32z" fill="#A83320"/>`;
  if (c.hat === "fur") s += `<path d="M25 44q-4-34 25-34t25 34q-3-10-7-16-14-9-36 0-4 6-7 16z" fill="#7A5636"/><ellipse cx="29" cy="46" rx="6" ry="13" fill="#6A4A2E"/><ellipse cx="71" cy="46" rx="6" ry="13" fill="#6A4A2E"/>`;
  return s + "</svg>";
}
const faceSVG = (cfg) => avatarSVG(cfg).replace('viewBox="0 0 100 200"', 'viewBox="20 -6 60 60"');

const $ = (id) => document.getElementById(id);
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2000); }
document.querySelectorAll("[data-soon]").forEach((b) => b.onclick = () => toast(b.dataset.soon + " is coming next"));

let uid = null, chats = [], prof = {}, tab = "all", q = "", cur = null, unsubMsgs = null;
const ago = (t) => { const s = (Date.now() - t) / 1000; return s < 60 ? "now" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d"; };
const PERSON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6z" fill="#fff"/></svg>';
const face = (p) => p && p.avatar ? faceSVG(p.avatar) : PERSON;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const unread = (c) => c.lastFrom && c.lastFrom !== uid && ((c.seen && c.seen[uid]) || 0) < c.lastAt;
async function getProf(id) {
  if (prof[id]) return prof[id];
  try { const s = await getDoc(doc(db, "profiles", id)); prof[id] = s.exists() ? s.data() : { name: "Unknown" }; } catch (e) { prof[id] = { name: "Unknown" }; }
  return prof[id];
}

function renderList() {
  const n = chats.filter(unread).length; $("un").textContent = n; $("un").style.display = n ? "grid" : "none";
  const list = chats.filter((c) => {
    const p = prof[c.other] || {}, nm = ((p.name || "") + " " + (p.username || "")).toLowerCase();
    return (!q || nm.includes(q)) && (tab !== "unread" || unread(c));
  }).sort((a, b) => b.lastAt - a.lastAt);
  if (!list.length) { $("rows").innerHTML = '<p class="empty">' + (chats.length ? "Nothing here." : "No chats yet. Tap the plus button and add a friend by username.") + "</p>"; return; }
  $("rows").innerHTML = list.map((c) => {
    const p = prof[c.other] || {}, u = unread(c);
    const st = c.lastFrom ? (u ? "New Chat" : c.lastFrom === uid ? "Sent" : "Received") + " \u00B7 " + ago(c.lastAt) : "Say hi";
    return '<button class="row" data-id="' + c.id + '"><span class="av' + (u ? " ring" : "") + '">' + face(p) + '</span><span><div class="nm">' + esc(p.name || p.username || "Friend") + '</div><div class="st' + (u ? " new" : "") + '">' + st + "</div></span></button>";
  }).join("");
}
$("rows").onclick = (e) => { const b = e.target.closest(".row"); if (b) openThread(chats.find((c) => c.id === b.dataset.id)); };
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  if (b.dataset.t === "groups" || b.dataset.t === "stories") return toast(b.textContent.trim() + " is coming next");
  tab = b.dataset.t; document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b)); renderList();
});
$("sbtn").onclick = () => { $("search").classList.toggle("on"); if ($("search").classList.contains("on")) $("q").focus(); else { $("q").value = ""; q = ""; renderList(); } };
$("q").oninput = () => { q = $("q").value.trim().toLowerCase(); renderList(); };

/* thread */
function openThread(c) {
  cur = c; const p = prof[c.other] || {};
  $("tav").innerHTML = face(p); $("tname").textContent = p.name || p.username || "Friend";
  $("thread").hidden = false; $("msgs").innerHTML = "";
  const cref = doc(db, "chats", c.id);
  updateDoc(cref, { ["seen." + uid]: Date.now() }).catch(() => {});
  if (unsubMsgs) unsubMsgs();
  unsubMsgs = onSnapshot(query(collection(db, "chats", c.id, "messages"), orderBy("at")), (s) => {
    $("msgs").innerHTML = s.docs.map((d) => { const m = d.data(); return '<div class="m' + (m.from === uid ? " me" : "") + '">' + esc(m.text) + "<small>" + ago(m.at) + "</small></div>"; }).join("");
    $("msgs").scrollTop = $("msgs").scrollHeight;
    const last = s.docs[s.docs.length - 1]; if (last && last.data().from !== uid) updateDoc(cref, { ["seen." + uid]: Date.now() }).catch(() => {});
  });
}
$("tback").onclick = () => { $("thread").hidden = true; if (unsubMsgs) unsubMsgs(); unsubMsgs = null; cur = null; };
$("comp").onsubmit = async (e) => {
  e.preventDefault(); const text = $("mi").value.trim(); if (!text || !cur) return; $("mi").value = "";
  const now = Date.now();
  try {
    await addDoc(collection(db, "chats", cur.id, "messages"), { from: uid, text, at: now });
    await updateDoc(doc(db, "chats", cur.id), { lastText: text, lastFrom: uid, lastAt: now, ["seen." + uid]: now });
  } catch (err) { toast("Message not sent. Check your connection."); }
};

/* add friend */
const openAdd = () => { $("err").textContent = ""; $("un_in").value = ""; $("addm").hidden = false; $("un_in").focus(); };
$("fab").onclick = openAdd; $("addtop").onclick = openAdd; $("addx").onclick = () => { $("addm").hidden = true; };
$("addgo").onclick = async () => {
  const u = $("un_in").value.trim().toLowerCase().replace(/^@/, ""); if (!u) return;
  $("err").textContent = "";
  try {
    const s = await getDoc(doc(db, "usernames", u));
    if (!s.exists()) { $("err").textContent = "No one has that username."; return; }
    const other = s.data().uid; if (other === uid) { $("err").textContent = "That is you."; return; }
    const id = [uid, other].sort().join("_");
    await setDoc(doc(db, "chats", id), { members: [uid, other], lastAt: Date.now() }, { merge: true });
    await getProf(other); $("addm").hidden = true;
    openThread({ id, other, members: [uid, other], lastAt: Date.now() });
  } catch (e) { $("err").textContent = "Could not add them. Check the Firestore rules."; }
};

onAuthStateChanged(auth, async (u) => {
  if (!u) { go("login.html?mode=login",true); return; }
  uid = u.uid;
  try {
    const s = await getDoc(doc(db, "users", uid)), d = s.exists() ? s.data() : null;
    if (!d || !d.avatar) { go("avatar.html",true); return; }
    prof[uid] = { name: d.name, username: d.username, avatar: d.avatar };
    $("meface").innerHTML = faceSVG(d.avatar);
    setDoc(doc(db, "profiles", uid), prof[uid]).catch(() => {});
    if (d.username) setDoc(doc(db, "usernames", d.username), { uid }).catch(() => {});
  } catch (e) {}
  onSnapshot(query(collection(db, "chats"), where("members", "array-contains", uid)), async (s) => {
    chats = s.docs.map((d) => Object.assign({ id: d.id, lastAt: 0 }, d.data()));
    chats.forEach((c) => c.other = c.members.find((m) => m !== uid));
    await Promise.all(chats.map((c) => getProf(c.other)));
    renderList();
  });
});
<\/script>
</body>

<script>
(function () {
  var LT = '<', pages = {};
  var END = LT + '/script', COM = LT + '!--';
  document.querySelectorAll('script[data-page]').forEach(function (s) {
    pages[s.dataset.page] = s.textContent.split(LT + '\\/script').join(END).split(LT + '\\!--').join(COM);
  });
  var frame = document.getElementById('v');
  window.__go = function (u, replace) {
    var m = String(u).match(/^([\w-]+)\.html(?:\?(.*))?$/); if (!m) return;
    var t = '#/' + (m[1] === 'index' ? '' : m[1]) + (m[2] ? '?' + m[2] : '');
    if (replace) location.replace(t); else location.hash = t;
  };
  function route() {
    var h = location.hash.replace(/^#\/?/, ''), parts = h.split('?'), key = pages[parts[0]] ? parts[0] : 'home';
    var pre = LT + 'head>' + LT + 'script>window.__Q=' + JSON.stringify(parts[1] || '') + ';window.go=function(u,r){parent.__go(u,r)}' + END + '>';
    frame.srcdoc = pages[key].replace(LT + 'head>', function () { return pre; });
  }
  frame.addEventListener('load', function () {
    try {
      var d = frame.contentDocument; document.title = d.title || 'Lapo Baby';
      d.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
        var h = a.getAttribute('href');
        if (/^[\w-]+\.html(\?|$)/.test(h)) { e.preventDefault(); window.__go(h); }
      });
    } catch (e) {}
  });
  addEventListener('hashchange', route); route();
})();
</script>
